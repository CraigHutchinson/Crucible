name: Advisory benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset bench
      - run: cmake --build --preset bench --parallel 4
      - run: ctest --preset bench
      - run: python3 scripts/capture_benchmarks.py
      - uses: actions/upload-artifact@v4
        with:
          name: crucible-benchmarks
          path: bench-results/current
