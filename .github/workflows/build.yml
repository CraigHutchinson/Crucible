name: Build and test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  production:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Development prerequisites
        run: python scripts/check_prerequisites.py --stage development --timeout 30 --budget 60
      - name: Build the exact production dependency with this runner's compiler
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch v1.77.3 --single-branch --config core.longpaths=true https://github.com/google/filament.git build/phase15-qualification/source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pin = (git -C build/phase15-qualification/source rev-parse HEAD).Trim()
          if ($pin -ne 'd852e34cd5629a6f3851d613dcd17aa0ffd025a2') { throw 'Unexpected Filament release source' }
          cmake -S build/phase15-qualification/source -B build/phase15-qualification/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DUSE_STATIC_CRT=OFF -DFILAMENT_WINDOWS_CI_BUILD=ON -DFILAMENT_SHORTEN_MSVC_COMPILATION=OFF -DFILAMENT_SKIP_SAMPLES=ON -DFILAMENT_SKIP_SDL2=ON -DFILAMENT_BUILD_TESTING=OFF -DFILAMENT_SUPPORTS_VULKAN=ON -DFILAMENT_SUPPORTS_OPENGL=OFF -DFILAMENT_SUPPORTS_METAL=OFF -DFILAMENT_SUPPORTS_WEBGPU=OFF -DFILAMENT_ENABLE_MATDBG=OFF -DFILAMENT_ENABLE_FGVIEWER=OFF -DFILAMENT_ENABLE_EXCEPTIONS=ON -DFILAMENT_ENABLE_RTTI=ON -DFILAMENT_ENABLE_LTO=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/phase15-qualification/release --target filament matc resgen imgui --parallel 3
          exit $LASTEXITCODE
      - name: Build the actual production caller and materials
        run: |
          cmake --preset production-release
          cmake --build --preset production-release
      - name: Receive frontend, packet and derived transform contracts
        run: python scripts/run_tests.py --preset production-release -L "production|application" --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-build-receipts
          retention-days: 90
          path: |
            build/production-release/Testing/Temporary
            build/production-release/compile_commands.json
            build/production-release/src/presentation/production/crucible/presentation/production/resources/*.filamat
            build/phase15-qualification/release/CMakeCache.txt
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}
    env:
      BUILD_PRESET: ${{ matrix.os == 'macos-15' && format('macos-{0}', matrix.preset) || format('desktop-{0}', matrix.preset) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Select complete macOS C++23 toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "CRUCIBLE_LLVM_ROOT=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
      - name: Linux window development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev xvfb xauth
      - name: Development prerequisites before configure/build
        run: python scripts/check_prerequisites.py --stage development --timeout ${{ runner.os == 'Windows' && '30' || '10' }} --budget 60
      - run: cmake --preset ${{ env.BUILD_PRESET }} -DCRUCIBLE_BUILD_RENDER_SPIKE=ON -DCRUCIBLE_BUILD_RULE_SPIKE=ON -DCRUCIBLE_ENABLE_DIAGNOSTICS=ON
      - run: cmake --build --preset ${{ env.BUILD_PRESET }} --parallel 4
      - run: python scripts/run_tests.py --preset ${{ env.BUILD_PRESET }}
      - name: Headless production benchmark receiving
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'release'
        run: |
          cmake --preset desktop-release -DCRUCIBLE_BUILD_BENCHMARKS=ON
          cmake --build build/desktop-release --target crucible_runtime_backbone_bench --parallel 4
          build/desktop-release/benchmarks/crucible_runtime_backbone_bench --arm integrated --scale 2048 --workers 2 --warmup 2 --ticks 6
          build/desktop-release/benchmarks/crucible_runtime_backbone_bench --arm direct --scale 2048 --workers 1 --warmup 2 --ticks 6
          build/desktop-release/benchmarks/crucible_runtime_backbone_bench --arm integrated --scale 2048 --workers 2 --warmup 2 --ticks 6 --profile-stages
      - name: Native X11 window event smoke
        if: runner.os == 'Linux'
        env:
          SDL_RENDER_DRIVER: software
        run: xvfb-run -a build/desktop-${{ matrix.preset }}/tests/integration/crucible_desktop_event_test --native
      - name: Capture actual structural software frames
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'release'
        run: build/desktop-release/tests/presentation/desktop/crucible_structural_examples "$RUNNER_TEMP/structural-frames" > "$RUNNER_TEMP/structural-frames.jsonl"
      - name: Capture readable desktop output at receiving sizes
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'release'
        run: |
          mkdir -p "$RUNNER_TEMP/readable-controls"
          build/desktop-release/tests/presentation/desktop/crucible_readable_controls_test "$RUNNER_TEMP/readable-controls" > "$RUNNER_TEMP/readable-controls/receiving.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/readable-controls/source.txt"
          git status --porcelain > "$RUNNER_TEMP/readable-controls/worktree.txt"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'release'
        with:
          name: readable-desktop-controls
          retention-days: 90
          path: ${{ runner.temp }}/readable-controls
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'release'
        with:
          name: structural-software-frames
          path: |
            ${{ runner.temp }}/structural-frames
            ${{ runner.temp }}/structural-frames.jsonl
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: python scripts/check_prerequisites.py --stage development
      - run: cmake --preset release -DCRUCIBLE_BUILD_RULE_SPIKE=ON -DCRUCIBLE_BUILD_SWARM_SPIKE=ON
      - run: cmake --build --preset release --parallel 4
      - run: python scripts/run_tests.py --preset release
      - name: SDL stays out of the ordinary dependency graph
        run: test ! -d build/release/_deps/sdl3-build
      - name: Production build consumes only its used sub0 packages
        run: |
          cmake --preset release -B build/production -DBUILD_TESTING=OFF
          cmake --build build/production --parallel 4
          build/production/crucible --mission --route
          test -d build/production/_deps/sub0pipeline-src
          test -d build/production/_deps/sub0pub-src
          test ! -d build/production/_deps/sub0log-src
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
      - run: python scripts/check_prerequisites.py --stage development --sanitize --timeout 30 --budget 60
      - run: cmake --preset desktop-sanitize -DCRUCIBLE_BUILD_RENDER_SPIKE=ON -DCRUCIBLE_BUILD_RULE_SPIKE=ON -DCRUCIBLE_ENABLE_DIAGNOSTICS=ON
      - run: cmake --build --preset desktop-sanitize --parallel 4
      - run: python scripts/run_tests.py --preset desktop-sanitize

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure the actual headless ThreadSanitizer receiver
        run: cmake --preset debug -B build/race -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Compile and execute the configured runtime canary
        run: python scripts/check_prerequisites.py --stage development --build-dir build/race --timeout 30 --budget 60
      - run: cmake --build build/race --parallel 4
      - name: Receive immutable queries, partitions and joined runtime ownership
        run: python scripts/run_tests.py --preset debug --test-dir build/race --prerequisite-build-dir build/race -L "spatial|swarm|scheduling|pipeline" --no-tests=error

  gpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Explicit shader and software Vulkan receiver tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools mesa-vulkan-drivers vulkan-tools xvfb xauth libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
      - name: Select and inspect executing software Vulkan device
        run: |
          selected_icd=""
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [ -f "$icd" ]; then
              selected_icd="$icd"
              echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
              VK_DRIVER_FILES="$icd" vulkaninfo --summary
              break
            fi
          done
          test -n "$selected_icd"
          glslangValidator --version
      - run: python scripts/check_prerequisites.py --stage development --gpu
      - run: cmake --preset gpu-release
      - run: cmake --build --preset gpu-release --parallel 4
      - run: xvfb-run -a python scripts/run_tests.py --preset gpu-release --prerequisite-report ${{ runner.temp }}/gpu-prerequisites.json
      - name: Actual receiver Debug readback
        run: |
          cmake --preset gpu-debug
          cmake --build --preset gpu-debug --target crucible_gpu_readback_test crucible_gpu_fault_test --parallel 4
          xvfb-run -a python scripts/run_tests.py --preset gpu-debug -R '^(gpu_instanced_readback|gpu_fault_receiving|gpu_fault_process)$' --no-tests=error
      - name: Actual receiver ASan/UBSan readback
        run: |
          cmake --preset gpu-sanitize
          python scripts/check_prerequisites.py --stage development --build-dir build/gpu-sanitize --sanitize --gpu
          cmake --build --preset gpu-sanitize --target crucible_gpu_readback_test crucible_gpu_fault_test --parallel 4
          xvfb-run -a python scripts/run_tests.py --preset gpu-sanitize -R '^(gpu_instanced_readback|gpu_fault_receiving|gpu_fault_process)$' --no-tests=error
      - name: Actual completed production-frame GPU captures
        run: xvfb-run -a python scripts/capture_gpu_examples.py --executable build/gpu-release/crucible_gpu_receiver --vertex build/gpu-release/gpu-shaders/world.vert.spv --fragment build/gpu-release/gpu-shaders/world.frag.spv --output ${{ runner.temp }}/gpu-captures
      - name: Visual capture dependencies
        run: python -m pip install Pillow matplotlib
      - name: Actual controlled-retirement captures
        run: xvfb-run -a python scripts/capture_phase7_examples.py gpu --executable build/gpu-release/tests/presentation/gpu/crucible_gpu_fault_test --vertex build/gpu-release/gpu-shaders/world.vert.spv --fragment build/gpu-release/gpu-shaders/world.frag.spv --output ${{ runner.temp }}/phase7-retirement
      - name: Frozen mission study and actual painter captures
        run: python scripts/capture_phase7_examples.py mission --executable build/gpu-release/tests/integration/crucible_mission_sensitivity --output ${{ runner.temp }}/phase7-mission
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-readback-evidence
          retention-days: 90
          path: |
            ${{ runner.temp }}/gpu-captures/
            ${{ runner.temp }}/phase7-retirement/
            ${{ runner.temp }}/phase7-mission/
            build/gpu-release/gpu-shader-toolchain.txt
            ${{ runner.temp }}/gpu-prerequisites.json
